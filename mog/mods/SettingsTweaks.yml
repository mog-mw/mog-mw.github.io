  - name: Distant Land And Objects
    settings: |
      [Terrain]
      distant terrain = true
      object paging active grid = true
      object paging min size = 0.023

  - name: Shadows
    settings: |
      [Shadows]
      enable shadows = true
      actor shadows = true
      player shadows = true
      terrain shadows = true
      object shadows = true
      number of shadow maps = 4
      compute scene bounds = bounds
      split point uniform logarithmic ratio = 1.0
      shadow map resolution = 4096
      normal offset distance = 2.0

  - name: Water
    settings: |
      [Water]
      shader = true
      rtt size = 512
      reflection detail = 2
      refraction = true

  - name: Increase Max Navmeshdb File Size
    settings: |
      [Navigator]
      max navmeshdb file size = 8589935000

  - name: Rebalance Soul Gem Values
    settings: |
      [Game]
      rebalance soul gem values = true

  - name: Use Magic Item Animations
    settings: |
      [Game]
      use magic item animations = true

  - name: Can Loot During Death Animation
    settings: |
      [Game]
      can loot during death animation = false

  - name: NPCs Avoid Collisions
    settings: |
      [Game]
      NPCs avoid collisions = true

  - name: Smooth Movement
    settings: |
      [Game]
      smooth movement = true

  - name: Swim Upward Correction
    settings: |
      [Game]
      swim upward correction = true

  - name: Turn To Movement Direction
    settings: |
      [Game]
      turn to movement direction = true

  - name: Color Topic Enable
    settings: |
      [GUI]
      color topic enable = true

  - name: Animation Blending
    settings: |
      [Game]
      smooth animation transitions = true

  - name: Camera Listener
    settings: |
      [Sound]
      camera listener = true

  - name: Antialias Alpha Test
    settings: |
      [Shaders]
      antialias alpha test = false

  - name: Trilinear Filtering
    settings: |
      [General]
      anisotropy = 16
      texture mipmap = linear

  - name: No Lua Profiler
    settings: |
      [Lua]
      lua profiler = false

  - name: No Preload Doors
    settings: |
      [Cells]
      preload doors = false

  - name: Map Zooming
    settings: |
      [Map]
      allow zooming = true
