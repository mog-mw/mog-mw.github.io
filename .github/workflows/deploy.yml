name: Build & Deploy Pages

on:
  push:
    branches:
      - main
      - stable

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: Checkout to Main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Build Testing
        run: |
          python build.py mog mog_output/testing

      - name: Checkout to Stable
        uses: actions/checkout@v7
        with:
          ref: stable

      - name: Build Stable
        run: |
          python build.py mog mog_output

      - name: Upload static files as artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: mog_output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
